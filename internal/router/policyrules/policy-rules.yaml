version: cervorules.policy.v3
name: calvoproxy.v3

trusted_users:
  - cervantes

defaults:
  executor: openrouter

# Where each fact cuts. These numbers are inside the bytes PolicyHash covers, so
# changing one is an auditable change — which is the whole point of moving them
# out of Go. They used to be `1<<20` and `1<<10` in bodySizeClass, where editing
# them moved nothing and decided nothing.
#
# The default is a policy statement, not a convenience: a request that carried no
# body reports zero bytes rather than failing to be decided. Without it, every
# GET would fail the decision, because an absent fact is a fault and not a
# silently unsatisfied guard.
facts:
  body_bytes: { min: 0, default: 0 }

# Ordered: the first matching deny wins, and a deny with no `operation` applies
# to every operation in the vocabulary.
denies:
  - id: deny-oversized-body
    reason: request body exceeds the size this policy allows
    when:
      { fact: body_bytes, op: gt, value: 10485760 }

routes:
  - operation: chat_completion
    target: cervocore
    executor: openrouter

  - operation: tool_orchestration
    target: cervocore
    executor: openrouter

  - operation: embedding
    target: cervocore
    executor: openrouter

  - operation: telegram_webhook
    target: cervobridge
    executor: openrouter

  - operation: secret_lookup
    target: cervovault_api
    executor: openrouter
    requires_trusted_user: true

  - operation: planning
    target: cervocore
    executor: openrouter

  - operation: media_request
    target: cervomedia
    executor: openrouter
    disabled_by_default: true
    disabled_reason: media backend not configured

tests:
  - name: chat allowed
    request:
      id: req-chat
      user: guest
      operation: chat_completion
    expect:
      allow: true
      target: cervocore
      executor: openrouter

  - name: secret trusted allowed
    request:
      id: req-secret-trusted
      user: cervantes
      operation: secret_lookup
    expect:
      allow: true
      target: cervovault_api
      executor: openrouter

  - name: media denied
    request:
      id: req-media
      user: guest
      operation: media_request
    expect:
      allow: false
      reason: media backend not configured

  - name: a body at the threshold is allowed
    request:
      id: req-body-at-limit
      user: guest
      operation: chat_completion
      metadata:
        body_bytes: "10485760"
    expect:
      allow: true
      target: cervocore
      executor: openrouter

  - name: one byte over the threshold is denied
    request:
      id: req-body-over-limit
      user: guest
      operation: chat_completion
      metadata:
        body_bytes: "10485761"
    expect:
      allow: false
      reason: request body exceeds the size this policy allows

  - name: an absent body falls back to the declared default
    request:
      id: req-no-body
      user: guest
      operation: chat_completion
    expect:
      allow: true
      target: cervocore
      executor: openrouter
