name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build (offline, vendored)
        run: GOPROXY=off go build -mod=vendor ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
