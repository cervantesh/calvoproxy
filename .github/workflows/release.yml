name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cross-compile and package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          build() {
            os="$1"; arch="$2"; ext="${3:-}"
            pkg="calvoproxy-${VERSION}-${os}-${arch}"
            mkdir -p "$pkg"
            GOOS="$os" GOARCH="$arch" go build -mod=vendor -o "$pkg/calvoproxy${ext}" ./cmd
            cp model-policy.json README.md LICENSE "$pkg"/
            if [ "$os" = "windows" ]; then
              zip -r "dist/${pkg}.zip" "$pkg"
            else
              tar czf "dist/${pkg}.tar.gz" "$pkg"
            fi
          }
          build windows amd64 .exe
          build darwin arm64
          build darwin amd64
          build linux amd64
          build linux arm64
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
