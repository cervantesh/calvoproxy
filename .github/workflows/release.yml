name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  packages:
    name: package-${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            extension: .exe
            archive: zip
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ""
            archive: tar
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            extension: ""
            archive: tar
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            extension: ""
            archive: tar
          - runner: macos-15
            goos: darwin
            goarch: arm64
            extension: ""
            archive: tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ startsWith(matrix.goos, 'darwin') && '1' || '0' }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          pkg="calvoproxy-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "$pkg" dist
          go build -mod=vendor -ldflags "-X main.version=${VERSION}" \
            -o "$pkg/calvoproxy${{ matrix.extension }}" ./cmd
          cp model-policy.json README.md LICENSE "$pkg"/
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "dist/${pkg}.zip" "$pkg"
          else
            tar czf "dist/${pkg}.tar.gz" "$pkg"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: (cd dist && sha256sum calvoproxy-* > SHA256SUMS.txt)
      - name: Sign checksums (Ed25519) and verify against the embedded key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          set -euo pipefail
          KEY_EMBEDDED="$(go run ./tools/keystatus)"
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            if [ "$KEY_EMBEDDED" = "embedded" ] && [ "${ALLOW_UNSIGNED_RELEASE:-}" != "true" ]; then
              echo "::error::RELEASE_SIGNING_KEY is missing while a public key is embedded."
              exit 1
            fi
            echo "No signing key and none embedded — publishing checksums only."
            exit 0
          fi
          go run ./tools/sign dist/SHA256SUMS.txt > dist/SHA256SUMS.txt.sig
          go run ./tools/verify dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
