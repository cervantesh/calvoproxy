services:
  calvoproxy:
    # Use the published image:
    # Pin a published release by immutable digest. Set CALVOPROXY_IMAGE to a
    # newer tag+digest together (never to :latest).
    image: "${CALVOPROXY_IMAGE:?set CALVOPROXY_IMAGE to ghcr.io/cervantesh/calvoproxy:<tag>@sha256:<digest>}"
    # ...or build locally instead (comment out `image:` above and uncomment):
    # build: .
    container_name: calvoproxy
    ports:
      - "8080:8080"
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in your env or a .env file}"
      PROXY_IDLE_TIMEOUT: "${PROXY_IDLE_TIMEOUT:-}"   # e.g. 20m to self-stop when idle
      OTEL_ENABLED: "false"
      # The container binds 0.0.0.0, so these two decide how safe that is:
      #  - PROXY_ADMIN_TOKEN gates /health, /metrics and /admin/reload.
      #  - PROXY_ALLOW_ENV_KEY_PUBLIC=true lets keyless clients spend the
      #    container's OPENROUTER_API_KEY. Leave it unset unless the port is only
      #    reachable by people you'd hand the key to; otherwise clients must send
      #    their own Authorization header.
      PROXY_ADMIN_TOKEN: "${PROXY_ADMIN_TOKEN:?set PROXY_ADMIN_TOKEN for a public container}"
      PROXY_ALLOW_ENV_KEY_PUBLIC: "${PROXY_ALLOW_ENV_KEY_PUBLIC:-}"
    volumes:
      # Learned reliability scores. Without this the container relearns which
      # models actually work on every recreation — and with PROXY_IDLE_TIMEOUT
      # plus `restart: on-failure` below, recreation is the normal cycle, not a
      # rare event. The image pins PROXY_SCORE_FILE=/data/scores.json.
      - calvoproxy-scores:/data
      # Optional: edit chains without rebuilding by mounting your own file:
      # - ./model-policy.json:/app/model-policy.json:ro
    # on-failure (not unless-stopped): a clean idle self-shutdown exits 0 and
    # must NOT be auto-restarted into a loop; a crash (non-zero) still restarts.
    restart: on-failure
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      # /ready (not /health): stays open and internals-free even when
      # PROXY_ADMIN_TOKEN gates /health, so the healthcheck won't false-fail.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Named, so `docker compose down` keeps the scores and only `down -v` discards
  # them — the same distinction the rest of the file already relies on.
  calvoproxy-scores:
