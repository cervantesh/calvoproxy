syntax = "proto3";

package calvoproxy.proxy.v1;

option go_package = "github.com/cervantesh/calvoproxy/gen/proto/proxyv1";

// ProxyTransportService is a thin gRPC transport in front of the same routing
// engine that backs the HTTP API: one unary RPC to proxy a chat completion and
// one to fetch health.
service ProxyTransportService {
  rpc ChatCompletion(ChatCompletionRequest) returns (ChatCompletionResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
}

message ChatCompletionRequest {
  string path = 1;
  string provider = 2;
  string authorization = 3;
  string body_json = 4;
  map<string, string> headers = 5;
}

message ChatCompletionResponse {
  int32 status_code = 1;
  string body_json = 2;
  map<string, string> headers = 3;
}

message GetHealthRequest {}

message GetHealthResponse {
  string body_json = 1;
}
